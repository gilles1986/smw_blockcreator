name: Build Desktop App

# Builds the Tauri desktop client for Windows, macOS and Linux.
#
#   - Pull requests / manual runs: builds all three platforms and uploads the
#     bundles as workflow artifacts, so a build can be tried without a release.
#   - Tags (e.g. v1.0.0): builds all three platforms, attaches the bundles to
#     a release draft, and automatically publishes the release once all three
#     platform builds succeed.

on:
  pull_request:
    branches: [main]
    paths:
      - 'core/**'
      - 'ui/**'
      - 'src-tauri/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/build-desktop.yml'
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag for release (e.g. v1.0.0). Leave empty to only build artifacts without publishing a release.'
        required: false
        default: ''
        type: string

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact: macos
          - platform: ubuntu-22.04
            args: ''
            rust-targets: ''
            artifact: linux
          - platform: windows-latest
            args: ''
            rust-targets: ''
            artifact: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build (and release on a version tag)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
          releaseName: 'BlockCreator ${{ github.event.inputs.release_tag || github.ref_name }}'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: blockcreator-${{ matrix.artifact }}
          path: |
            src-tauri/target/**/release/bundle/**
            src-tauri/target/release/bundle/**
          if-no-files-found: warn

  publish-release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
    steps:
      - name: Publish Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          echo "Publishing release for tag: $TAG_NAME"
          gh release edit "$TAG_NAME" --draft=false
